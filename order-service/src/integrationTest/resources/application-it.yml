# Integration-test profile (activated by @ActiveProfiles("it")). Additive on top of the main
# application.yml; datasource and Kafka bootstrap are injected by Testcontainers @ServiceConnection.
# Avro serialization runs against an in-JVM mock Schema Registry (real Confluent serializers, mock
# transport), shared with the test's verification consumer via the identical mock:// URL.
spring:
  kafka:
    properties:
      schema.registry.url: mock://aoep-it
logging:
  level:
    org.apache.kafka: WARN
    org.testcontainers: INFO
    com.athlete: INFO
