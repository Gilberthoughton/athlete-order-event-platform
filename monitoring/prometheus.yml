# Prometheus scrapes the two services' Actuator Prometheus endpoints. The services run on the
# host (./gradlew bootRun), so Prometheus reaches them via host.docker.internal (mapped in compose).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          application: order-service

  - job_name: inventory-consumer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          application: inventory-consumer
