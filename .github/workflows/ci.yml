name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` compiles both modules, generates the Avro classes from the .avsc contract, and runs
      # the unit suite — including the schema-compatibility gate, which fails on a breaking edit to
      # the published contract.
      - name: Build and run unit tests
        run: ./gradlew build --no-daemon

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: "**/build/reports/tests/test"

  integration:
    name: integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The integration tier is the point of this repository: it runs the real order flow against
      # PostgreSQL and Kafka in Testcontainers (the runner provides the Docker daemon), proving the
      # event store, the transactional outbox, projection replay, and consumer idempotency rather
      # than asserting against mocks.
      - name: Run integration tests
        run: ./gradlew integrationTest --no-daemon

      - name: Upload integration test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: "**/build/reports/tests/integrationTest"
