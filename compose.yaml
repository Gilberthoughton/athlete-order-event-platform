# Local stack for the Athlete Order Event Platform.
# One command boots everything the two services need:  docker compose up -d
#
# - PostgreSQL hosts two logical databases: `orders` (order-service) and `fulfillment`
#   (inventory-consumer), created by ./compose/postgres/init.sql.
# - Kafka runs single-node in KRaft mode (no ZooKeeper) for a light local footprint.
services:
  postgres:
    image: postgres:16
    container_name: aoep-postgres
    environment:
      POSTGRES_USER: aoep
      POSTGRES_PASSWORD: aoep
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - ./compose/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - aoep-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoep -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: aoep-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  aoep-pgdata:
